<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Repositorio Powerchair MX</title>

<style>
/* Layout: barra superior con selector de rol · navegación lateral por módulo · área de trabajo con tablas y paneles de detalle */
:root{
  --bg:#F6F5F0; --surface:#FFFFFF; --surface-2:#EFEDE6; --line:#E2DFD6;
  --ink:#13213F; --ink-2:#55607A; --accent:#2B6CB0; --accent-soft:#E1ECF7; --on-accent:#FFFFFF;
  --warm:#F2A33A; --warm-soft:#FCEBD0; --warm-ink:#8A4B00;
  --ok:#2F7A52; --ok-soft:#DDF1E5; --bad:#B83232; --bad-soft:#FBE3E3;
  --nav:#13213F; --nav-ink:#DCE3F0; --nav-muted:#93A1BD;
  --f-display:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-body:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1628; --surface:#16213A; --surface-2:#1D2A47; --line:#2A3858;
  --ink:#EEF1F7; --ink-2:#A6B1C7; --accent:#72A9E9; --accent-soft:#1C3356; --on-accent:#0E1628;
  --warm:#F2A33A; --warm-soft:#3A2A12; --warm-ink:#F6C27A;
  --ok:#62C690; --ok-soft:#153828; --bad:#F07C7C; --bad-soft:#3D1C1F;
  --nav:#0A1120; --nav-ink:#D2DAEA; --nav-muted:#8492AE; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1628; --surface:#16213A; --surface-2:#1D2A47; --line:#2A3858;
  --ink:#EEF1F7; --ink-2:#A6B1C7; --accent:#72A9E9; --accent-soft:#1C3356; --on-accent:#0E1628;
  --warm:#F2A33A; --warm-soft:#3A2A12; --warm-ink:#F6C27A;
  --ok:#62C690; --ok-soft:#153828; --bad:#F07C7C; --bad-soft:#3D1C1F;
  --nav:#0A1120; --nav-ink:#D2DAEA; --nav-muted:#8492AE; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--nav)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:26px;font-weight:700;letter-spacing:-.01em}
h2{font-size:18px;font-weight:700}
h3{font-size:15px;font-weight:600}
p{margin:0}
a{color:var(--accent)}
.mono{font-family:var(--f-mono);font-size:12.5px}
.muted{color:var(--ink-2)}
.num{font-variant-numeric:tabular-nums}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--nav);color:var(--nav-ink);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand b{font-weight:700;font-size:15px;color:#fff}
.brand span{display:block;font-size:12px;color:var(--nav-muted)}
.role{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--nav-muted)}
.role select{background:transparent;color:#fff;border:1px solid #3A4A6E;border-radius:8px;padding:6px 10px;font:inherit;font-size:14px;font-weight:600}
.role select option{color:#13213F;background:#fff}
.notice{background:var(--warm-soft);color:var(--warm-ink);font-size:13px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:7px}

.shell{display:grid;grid-template-columns:236px minmax(0,1fr);align-items:start}
.side{background:var(--surface);border-right:1px solid var(--line);padding-block:16px;padding-inline:12px;
  position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);min-height:calc(100vh - 100px)}
.navlabel{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);padding:14px 12px 6px;font-weight:600}
.side a{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;color:var(--ink-2);text-decoration:none;font-weight:500;font-size:14px;white-space:nowrap}
.side a:hover{background:var(--surface-2);color:var(--ink)}
.side a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.side a .lk{margin-left:auto;opacity:.7;display:inline-flex}
.side a.locked{opacity:.6}
main{padding-block:28px 72px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));min-width:0;max-width:1180px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.head .sub{color:var(--ink-2);margin-top:4px;max-width:65ch}
.stack{display:flex;flex-direction:column;gap:16px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile .lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.tile .big{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.tile .big small{font-size:15px;font-weight:500;color:var(--ink-2)}
.tile .foot{font-size:13px;color:var(--ink-2)}
.track{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);border-radius:99px}
.track.warm i{background:var(--warm)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.panel > h2{margin-bottom:12px}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
.grid2.even{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}

.bars{display:flex;flex-direction:column;gap:10px}
.barrow{display:grid;grid-template-columns:130px minmax(0,1fr) 28px;align-items:center;gap:10px;font-size:14px}
.barrow .track{height:12px}

.list{display:flex;flex-direction:column}
.list > div{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.list > div:first-child{border-top:0;padding-top:0}
.list .ico{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center}

.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);text-align:left;font-weight:600;padding:10px 12px;background:var(--surface-2);white-space:nowrap}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:top}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
tr.sel td{background:var(--accent-soft)}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}

.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap;line-height:1.6}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warm-soft);color:var(--warm-ink)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.pill.neu{background:var(--surface-2);color:var(--ink-2)}

.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:8px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.filters > *{flex:1 1 150px;min-width:0}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-2);font-weight:500;min-width:0}
input,select,textarea{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:14px;width:100%;min-width:0}
.searchbox{position:relative}
.searchbox svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink-2)}
.searchbox input{padding-left:34px}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.formgrid .full{grid-column:1/-1}

.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 16px;font-size:14px}
.kv dt{color:var(--ink-2)}
.kv dd{margin:0;font-weight:500}
.sect{border-top:1px solid var(--line);padding-top:14px;margin-top:14px;display:flex;flex-direction:column;gap:10px}
.sect-t{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);font-weight:600;display:flex;align-items:center;gap:8px;justify-content:space-between}

.lockbox{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px dashed var(--line);border-radius:10px;background:var(--surface-2);color:var(--ink-2);font-size:14px}
.medbox{border:1px solid var(--warm);background:var(--warm-soft);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px}
.medbox .kv dd{color:var(--ink)}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;font-size:14px}
.alert.warn{background:var(--warm-soft);color:var(--warm-ink)}
.alert.bad{background:var(--bad-soft);color:var(--bad)}
.alert.ok{background:var(--ok-soft);color:var(--ok)}
.alert.info{background:var(--accent-soft);color:var(--accent)}

.modcard{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.modcard:hover{border-color:var(--accent)}
.modcard .mi{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.modcard.lock .mi{background:var(--surface-2);color:var(--ink-2)}

.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.thumb{aspect-ratio:16/10;max-width:100%;display:grid;place-items:center;position:relative}
.thumb .yr{position:absolute;left:10px;bottom:8px;font-family:var(--f-mono);font-size:12px;font-weight:500}
.t-Foto{background:var(--accent-soft);color:var(--accent)}
.t-Video{background:var(--warm-soft);color:var(--warm-ink)}
.t-Prensa{background:var(--ok-soft);color:var(--ok)}
.t-Documento{background:var(--surface-2);color:var(--ink-2)}
.t-Logo{background:var(--bad-soft);color:var(--bad)}
.mbody{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.mbody .fn{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-2);overflow-wrap:anywhere}
.mbody .row{display:flex;gap:6px;flex-wrap:wrap}

.tl{display:flex;flex-direction:column;position:relative;padding-left:4px}
.tl > div{display:grid;grid-template-columns:86px minmax(0,1fr);gap:14px;padding:8px 0;position:relative}
.tl .y{font-family:var(--f-mono);font-size:13px;font-weight:500;color:var(--accent);padding-top:1px}
.tl .d{border-left:2px solid var(--line);padding-left:14px;position:relative}
.tl .d::before{content:"";position:absolute;left:-6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--warm)}

.tree{font-family:var(--f-mono);font-size:13px;line-height:1.75;overflow-x:auto;white-space:pre;background:var(--surface-2);border-radius:10px;padding:14px 16px;margin:0}
.tree .rs{color:var(--bad)}
.tree .c{color:var(--ink-2)}
.namebox{font-family:var(--f-mono);font-size:13.5px;padding:10px 12px;border-radius:8px;background:var(--surface-2);overflow-wrap:anywhere}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;font:inherit;font-weight:600;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}

.kanban{display:grid;grid-template-columns:repeat(4,minmax(200px,1fr));gap:12px;overflow-x:auto;padding-bottom:4px}
.col{background:var(--surface-2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:200px}
.col h3{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.kcard .mv{display:flex;gap:6px;justify-content:flex-end}

.report{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px;max-width:780px}
.report h2{font-size:22px}
.report .rk{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:18px 0}
.report .rk div{border-left:3px solid var(--warm);padding:2px 0 2px 12px}
.report .rk b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.report .rk span{font-size:13px;color:var(--ink-2)}
.report p{max-width:65ch;margin-top:10px}
.report ul{margin:8px 0 0;padding-left:20px}

.guide ol{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:14px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:500;z-index:50;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.2)}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:static;min-height:0;border-right:0;border-bottom:1px solid var(--line);display:flex;gap:4px;overflow-x:auto;
    padding-block:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
  .navlabel{display:none}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 72px}
  .grid2,.grid2.even{grid-template-columns:1fr}
}
@media (max-width:520px){
  .formgrid{grid-template-columns:1fr}
  .barrow{grid-template-columns:96px minmax(0,1fr) 24px}
  .report{padding:18px}
  .tl > div{grid-template-columns:64px minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="topbar">
  <div class="brand">

<script>
/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mxn = n => new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:0}).format(n);
const int = n => new Intl.NumberFormat('es-MX').format(n);
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const fdate = d => { const [y,m,dd] = d.split('-'); return dd ? `${+dd} ${MESES[+m-1]} ${y}` : `${MESES[+m-1]} ${y}`; };
const norm = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9@. ]/g,' ').replace(/\s+/g,' ').trim();
function lev(a,b){ const m=a.length,n=b.length; if(!m) return n; if(!n) return m; let p=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){ const c=[i]; for(let j=1;j<=n;j++) c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); p=c; } return p[n]; }
let toastT; function toast(msg){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2600); }

const ICONS = {
  home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6"/>',
  wrench:'<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18v3h3l6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.5-.5-.5-2.5z"/>',
  image:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 17l-5-5-9 8"/>',
  heart:'<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>',
  folder:'<path d="M3 6a1 1 0 0 1 1-1h5l2 2h9a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/>',
  doc:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/>',
  help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5v.7M12 17h.01"/>',
  lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  unlock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-2"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
  video:'<rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3z"/>',

function renderNav(){
  $('#nav').innerHTML = NAV.map(n=>{
    if(n[0]==='g') return `<div class="navlabel">${n[1]}</div>`;
    const lk = !can(n[0]);
    return `<a href="#${n[0]}" class="${S.view===n[0]?'on':''} ${lk?'locked':''}">${ic(n[2])}<span>${n[1]}</span>${lk?`<span class="lk" title="Sin acceso con este rol">${ic('lock',14)}</span>`:''}</a>`;
  }).join('');
}
function go(){
  const h = (location.hash||'').slice(1);
  S.view = ALL.includes(h) ? h : (R().v[0]);
  render();
}
window.addEventListener('hashchange',go);
$('#role').addEventListener('change',e=>{

});

function render(){
  renderNav();

  bind();
}
function lockedView(v){
  const who = ALL.filter(x=>x===v).length ? Object.values(ROLES).filter(r=>r.v.includes(v)).map(r=>r.l).join(', ') : '';
  return `<div class="head"><div><h1>${esc(TITLES[v])}</h1></div></div>

function findDups(n,e){
  const nn=norm(n), ne=norm(e); if(nn.length<4 && ne.length<4) return [];
  return DON.filter(d=>{ const dn=norm(d.n);
    if(ne.length>4 && norm(d.em)===ne) return true;
    if(nn.length<4) return false;
    if(dn===nn || dn.includes(nn) || nn.includes(dn)) return true;
    const t1=nn.split(' '), t2=dn.split(' '); const shared=t1.filter(t=>t.length>2 && t2.some(u=>lev(t,u)<=1)).length;
    return shared>=2 || lev(nn,dn)<=3; });
}

function bind(){
  const on = (sel,ev,fn) => { const el=$(sel); if(el) el.addEventListener(ev,fn); };
  const keep = (sel,obj,key) => on(sel,'input',e=>{ obj[key]=e.target.value; const pos=e.target.selectionStart; render(); const n=$(sel); if(n){ n.focus(); try{n.setSelectionRange(pos,pos);}catch(_){} } });
  // atletas
  keep('#af-q',S.af,'q'); ['t','cat','con'].forEach(k=>on('#af-'+k,'change',e=>{S.af[k]=e.target.value;render();}));
  document.querySelectorAll('[data-ath]').forEach(tr=>{ const f=()=>{S.ath=tr.dataset.ath;render();}; tr.addEventListener('click',f); tr.addEventListener('keydown',e=>{if(e.key==='Enter')f();}); });
  document.querySelectorAll('[data-med]').forEach(b=>b.addEventListener('click',()=>{
    const id=b.dataset.med, d=new Date(); S.medOpen.add(id);
    LOG.unshift({t:`${d.getDate()} ${MESES[d.getMonth()]} ${d.getFullYear()} · ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`,r:R().l,a:id});
    render(); toast('Acceso registrado en la bitácora');
  }));
  // medios
  ['tp','eq','au','y'].forEach(k=>on('#mf-'+k,'change',e=>{S.mf[k]=e.target.value;render();}));
  if($('#nf-name')){ ['#nf-f','#nf-eq','#nf-tp','#nf-d'].forEach(s=>{ $(s).addEventListener('input',nfName); $(s).addEventListener('change',nfName); }); nfName();
    on('#nf-add','click',()=>{ const r=nfName(); const msg=$('#nf-msg');
      if(!r.ok){ msg.innerHTML=`<div class="alert bad">${ic('alert',16)}<span>Escribe una descripción de al menos 3 letras para nombrar el archivo.</span></div>`; return; }
      if(MED.some(x=>x.fn===r.name)){ msg.innerHTML=`<div class="alert warn">${ic('alert',16)}<span>Ya existe un archivo con ese nombre. Cambia la descripción.</span></div>`; return; }
      MED.push({fn:r.name,tp:r.tp,eq:r.eq,ev:r.d,au:$('#nf-au').value,mg:'Migrado',y:r.f.slice(0,4)});
      S.mf={tp:'',eq:'',au:'',y:''}; render(); toast(`Agregado: ${r.name}`); }); }
  // donantes
  document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{S.dTab=b.dataset.tab;render();}));
  keep('#df-q',S.df,'q'); on('#df-k','change',e=>{S.df.k=e.target.value;render();});
  document.querySelectorAll('[data-don]').forEach(tr=>{ const f=()=>{S.don=tr.dataset.don;render();}; tr.addEventListener('click',f); tr.addEventListener('keydown',e=>{if(e.key==='Enter')f();}); });
  document.querySelectorAll('[data-done]').forEach(b=>b.addEventListener('click',()=>{ const d=DON.find(x=>x.id===b.dataset.done); d.nx=''; d.nf=''; render(); toast('Acción marcada como hecha'); }));
  document.querySelectorAll('[data-mv]').forEach(b=>b.addEventListener('click',()=>{ const p=PIPE[+b.dataset.mv]; p.st=Math.min(3,Math.max(0,p.st+(+b.dataset.d))); render(); toast(`${p.e}: ${STAGES[p.st]}`); }));
  if($('#nd-n')){
    const chk=()=>{ const ds=findDups($('#nd-n').value,$('#nd-e').value); const box=$('#nd-dup');
      box.innerHTML = ds.length ? `<div class="alert warn">${ic('alert',16)}<div style="flex:1"><b>Posible duplicado.</b> Ya existe${ds.length>1?'n':''}: ${ds.map(d=>`<button class="btn sm" style="margin:4px 4px 0 0" data-open="${d.id}">${esc(d.n)}</button>`).join('')}<div style="font-size:13px;margin-top:4px">Abre el registro existente en lugar de crear uno nuevo.</div></div></div>` : '';
      box.querySelectorAll('[data-open]').forEach(x=>x.addEventListener('click',()=>{S.don=x.dataset.open;S.dTab='registro';S.df={q:'',k:''};render();}));
      return ds; };
    $('#nd-n').addEventListener('input',chk); $('#nd-e').addEventListener('input',chk);
    on('#nd-save','click',()=>{ const n=$('#nd-n').value.trim(); if(n.length<3){ $('#nd-dup').innerHTML=`<div class="alert bad">${ic('alert',16)}<span>Escribe el nombre completo o la razón social.</span></div>`; return; }
      if(chk().length){ toast('Revisa el posible duplicado antes de guardar'); return; }
      const k=$('#nd-k').value, m=+$('#nd-m').value, id='D'+String(DON.length+1).padStart(2,'0');
      DON.push({id,n,k,em:$('#nd-e').value.trim()||'—',m,since:'2026-10',fac:$('#nd-f').value==='1',nx:'Enviar bienvenida',nf:'2026-11-02',hist:m?[{f:'2026-10',m,st:'Cobrado'}]:[]});
      S.don=id; S.dTab='registro'; render(); toast(`Registro guardado: ${n}`); });
  }
  // reporte
  on('#rp-aud','change',e=>{S.rep.aud=e.target.value; $('#rp-out').innerHTML=buildReport();});
  on('#rp-go','click',()=>{ $('#rp-out').innerHTML=buildReport(); toast('Reporte generado'); });
  on('#rp-copy','click',()=>{ if(!lastReport) buildReport();
    const done=()=>toast('Texto del reporte copiado');
    try{ navigator.clipboard.writeText(lastReport).then(done).catch(fallback); }catch(_){ fallback(); }
    function fallback(){ const ta=document.createElement('textarea'); ta.value=lastReport; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy'); done();}catch(_){ toast('Selecciona el texto del reporte y cópialo manualmente'); } ta.remove(); } });
}

go();
</script>

</body></html>
